<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#FAF8F3"/>

  <!-- Decorative card stack (back) -->
  <g transform="translate(650, 140) rotate(-8)">
    <rect width="180" height="220" rx="12" fill="white" stroke="#B8B3AA" stroke-width="2"/>
    <rect y="0" width="180" height="8" rx="4" fill="#2952A3"/>
  </g>

  <g transform="translate(680, 160) rotate(-4)">
    <rect width="180" height="220" rx="12" fill="white" stroke="#B8B3AA" stroke-width="2"/>
    <rect y="0" width="180" height="8" rx="4" fill="#7B3FA8"/>
  </g>

  <!-- Main featured card -->
  <g transform="translate(720, 180)">
    <rect width="180" height="220" rx="12" fill="white" stroke="#B8B3AA" stroke-width="2"/>
    <rect y="0" width="180" height="8" rx="4" fill="#C8430A"/>
    <text x="16" y="40" font-family="serif" font-size="11" fill="#6B665E">PLOT</text>
    <text x="16" y="70" font-family="serif" font-size="18" font-weight="600" fill="#1A1714">Opening Image</text>
    <text x="16" y="100" font-family="sans-serif" font-size="12" fill="#6B665E">We meet Elena walking</text>
    <text x="16" y="118" font-family="sans-serif" font-size="12" fill="#6B665E">through the dead orchard</text>
    <text x="16" y="136" font-family="sans-serif" font-size="12" fill="#6B665E">at dawn...</text>
    <rect x="16" y="170" width="50" height="22" rx="11" fill="#FAF8F3"/>
    <text x="26" y="185" font-family="sans-serif" font-size="10" fill="#1A6B5A">Elena</text>
  </g>

  <!-- Second visible card -->
  <g transform="translate(940, 200)">
    <rect width="180" height="220" rx="12" fill="white" stroke="#B8B3AA" stroke-width="2"/>
    <rect y="0" width="180" height="8" rx="4" fill="#1A6B5A"/>
    <text x="16" y="40" font-family="serif" font-size="11" fill="#6B665E">CHARACTER</text>
    <text x="16" y="70" font-family="serif" font-size="18" font-weight="600" fill="#1A1714">Elena's Secret</text>
    <text x="16" y="100" font-family="sans-serif" font-size="12" fill="#6B665E">Elena has been hiding</text>
    <text x="16" y="118" font-family="sans-serif" font-size="12" fill="#6B665E">letters from her</text>
    <text x="16" y="136" font-family="sans-serif" font-size="12" fill="#6B665E">grandmother...</text>
  </g>

  <!-- App title and tagline -->
  <text x="80" y="200" font-family="serif" font-size="64" font-weight="600" fill="#1A1714">Storycards</text>
  <text x="80" y="260" font-family="sans-serif" font-size="24" fill="#6B665E">Digital index cards for writers</text>

  <!-- Feature bullets -->
  <g transform="translate(80, 320)">
    <circle cx="8" cy="8" r="6" fill="#C8430A"/>
    <text x="24" y="14" font-family="sans-serif" font-size="18" fill="#1A1714">Drag-and-drop story beats</text>
  </g>
  <g transform="translate(80, 360)">
    <circle cx="8" cy="8" r="6" fill="#1A6B5A"/>
    <text x="24" y="14" font-family="sans-serif" font-size="18" fill="#1A1714">AI-powered summaries</text>
  </g>
  <g transform="translate(80, 400)">
    <circle cx="8" cy="8" r="6" fill="#2952A3"/>
    <text x="24" y="14" font-family="sans-serif" font-size="18" fill="#1A1714">Shareable URLs</text>
  </g>
  <g transform="translate(80, 440)">
    <circle cx="8" cy="8" r="6" fill="#7B3FA8"/>
    <text x="24" y="14" font-family="sans-serif" font-size="18" fill="#1A1714">Shuffle to discover</text>
  </g>

  <!-- URL at bottom -->
  <text x="80" y="560" font-family="monospace" font-size="16" fill="#B8B3AA">storycards.vercel.app</text>
</svg>
